services:
  postgres:
    image: postgres:17
    container_name: nullsupport-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nullsupport_erp
      POSTGRES_USER: nullsupport_erp
      POSTGRES_PASSWORD: nullsupport_erp_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nullsupport_erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U nullsupport_erp -d nullsupport_erp"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nullsupport_erp_postgres_data:
